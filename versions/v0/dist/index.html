<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf1f3"><title>평균 · 물리 실험실</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23285ccd'/%3E%3Ctext x='7' y='24' font-size='26' fill='white'%3Eμ%3C/text%3E%3C/svg%3E"></head><body>
<main id="lab">
<header><a href="#" class="brand" aria-label="평균 실험실">μ <span>평균</span></a><nav aria-label="문제"><button data-problem="mean">탐구</button><button data-problem="transform">1-1</button><button data-problem="subjects">1-2</button><button data-problem="overlap">1-3</button><button data-problem="groups">두 집단</button><button data-problem="sample">표본</button></nav><div class="header-actions"><button id="numbers" aria-label="숫자 표시" aria-pressed="false" title="숫자 표시">#</button><button id="edit-data" aria-label="자료 편집" title="자료 편집">☷</button><button id="help" aria-label="설명" class="help">!</button></div></header>
<aside id="lesson"><div id="origin"></div><h1 id="question"></h1><div id="givens"></div><div id="controls"></div><output id="result" hidden aria-live="polite"></output><output id="numeric-summary" hidden></output></aside>
<section id="workspace"><div id="viewport" tabindex="0" role="application" aria-label="3D 평균 실험. 휠 확대, 배경 회전, 오른쪽 드래그 이동. 스페이스 재생."></div><div class="view-tools"><button id="zoom-in" aria-label="확대" title="확대">+</button><button id="zoom-out" aria-label="축소" title="축소">−</button><button id="front" aria-label="정면" title="정면">▤</button><button id="iso" aria-label="입체 시점" title="입체 시점">◇</button><button id="fit" aria-label="전체 보기" title="전체 보기">⊡</button></div><div id="scene-note"></div><div id="loading">◌</div><div id="chart-panel" hidden><canvas id="chart" tabindex="0" aria-label="표본평균 분포. 휠 확대, 드래그 이동, 두 번 누르면 초기화."></canvas><div class="chart-tools"><span class="dot orange"></span>μ <output id="trials">0</output><button id="chart-minus" aria-label="분포 축소">−</button><button id="chart-plus" aria-label="분포 확대">+</button><button id="chart-fit" aria-label="분포 전체 보기">⊡</button><button id="compare" aria-label="현재 분포 저장" title="비교 저장">▱</button></div></div></section>
<footer><button id="random" aria-label="새 무작위 자료" title="무작위">⚄</button><button id="reset" aria-label="처음으로" title="처음으로">↺</button><button id="play" aria-label="재생" class="primary" title="재생">▶</button><button id="step" aria-label="한 단계" title="한 단계">▸|</button><label for="speed" aria-label="시뮬레이션 속도">◷</label><input type="range" id="speed" min=".25" max="4" step=".25" value="1" aria-label="시뮬레이션 속도"><output id="speed-value">1×</output><button id="motion-help" class="help" aria-label="조작 설명">!</button></footer><div id="toast" role="status" hidden></div>
</main><dialog id="info-dialog"><form method="dialog"><button class="close" aria-label="닫기">×</button></form><div id="info-content"></div></dialog><dialog id="data-dialog"><form method="dialog"><button class="close" aria-label="닫기">×</button></form><h2>자료</h2><div class="row"><button id="preset-simple">상자</button><button id="preset-pdf">교재 · 키</button><button id="preset-random">⚄</button></div><label for="data-values" class="sr-only">쉼표로 구분한 자료</label><textarea id="data-values" rows="4"></textarea><label for="data-count">n</label><input id="data-count" type="range" min="2" max="20" value="6"><output id="count-out">6</output><button id="apply-data" class="primary">적용</button><p id="data-error" role="status"></p></dialog><noscript>JavaScript를 켜 주세요.</noscript><script src="lab.js" defer></script></body></html>
